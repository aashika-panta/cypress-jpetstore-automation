
```yaml
name: JPetStore Cypress Tests

on:
  # Run every day at 7:00 PM Nepal time
  schedule:
    - cron: "15 13 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

  # Run when code is pushed to main
  push:
    branches:
      - main

  # Run when a pull request targets main
  pull_request:
    branches:
      - main

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Run Cypress tests
      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
